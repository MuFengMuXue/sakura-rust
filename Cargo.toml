[package]
name = "sakura-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
langgraph = { path = "F:/langgraph-rust",features = ["full"] }
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
chrono = "0.4"
env_logger = "0.11.11"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1   
panic = "abort"      
strip = true